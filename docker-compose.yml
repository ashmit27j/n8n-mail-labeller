services:
  n8n:
    image: n8nio/n8n:latest
    container_name: mail-labeller-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - N8N_RUNNERS_ENABLED=true
      - WEBHOOK_URL=http://localhost:5679/
    volumes:
      - mail_labeller_n8n_data:/home/node/.n8n

volumes:
  mail_labeller_n8n_data:
